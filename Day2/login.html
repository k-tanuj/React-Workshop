<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header>
    <h1>Resume Login Form</h1>
    </header>
    <br><br><br>
    <form class = "form">
        <label>Contact:</label>
        <input class="contact" type="text" required pattern="[0-9]{10}">
        <br><br>

        <label>Password:</label>
        <input class="pass" type="password" required>
        <br><br>


        <button type="submit">Login</button>
        <br><br>

    </form>

    <script src="app.js"></script>

</body>

</html>
